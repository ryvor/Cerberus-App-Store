{
	"name": "Official",
	"version": "0.0.0-Alpha/1",
	"description": "Official package for the project",
	"author": "Ryvor",
	"apps" :[
		{	"id": "dozzle",
			"name": "Dozzle",
			"description": "Live Docker log viewer with a lightweight UI.",
			"category": "observability",
			"image": "amir20/dozzle",
			"tags": [
				"docker",
				"logs"
			],
			"highlights": [
				"Log streaming",
				"Container filtering",
				"Lightweight",
			],
			"readme": "https://github.com/amir20/dozzle/raw/refs/heads/master/README.md",
			"versions": [
				{
					"tag": "latest",
					"label": "Latest"
				},
			],
			"links":[
				"github": "https://github.com/amir20/dozzle",
			],
			"deployments": [
				"latest": {
					"container_name": "dozzle",
					"image": "amir20/dozzle:latest",
					"ports":[{
						"host": 8080,
						"container": 8080,
						"label": "Web UI",
					}],
					"volumes": [{
							"host": "/var/run/docker.sock",
							"container": "/var/run/docker.sock",
							"label": "Docker Socket",
						}
					]
				},
			],
		}, {"id": "portainer",
			"name": "Portainer",
			"description": "Container management UI for Docker and Kubernetes.",
			"category": "infrastructure",
			"image": "portainer/portainer-ce",
			"tags": [
				"docker",
				"kubernetes",
			],
			"highlights": [
				"Docker UI",
				"Stack manager",
				"Access control",
			],
			"readme": "https://github.com/portainer/portainer/raw/refs/heads/master/README.md",
			"versions": [
				{
					"tag": "latest",
					"label": "Latest"
				},
			],
			"links": [
				"github": "https://github.com/portainer/portainer",
				"docs": "https://docs.portainer.io/",
			],
			"deployments": [
				"latest": {
					"container_name": "portainer",
					"image": "portainer/portainer-ce:latest",
					"ports":[{
						"host": 9000,
						"container": 9000,
						"label": "HTTP",
					}, {
						"host": 9443,
						"container": 9443,
						"label": "HTTPS",
					}],
					"volumes": [{
						"host": "/var/run/docker.sock",
						"container": "/var/run/docker.sock",
						"label": "Docker Socket",
					}, {
						"host": "./data",
						"container": "/data",
						"label": "Portainer Data",
					}],
				}
			]
		}, {"id": "uptime-kuma",
			"name": "Uptime Kuma",
			"logo": "https://raw.githubusercontent.com/louislam/uptime-kuma/master/public/icon.png",
			"description": "Self-hosted monitoring and uptime tracking.",
			"category": "monitoring",
			"image": "louislam/uptime-kuma",
			"restart": "unless-stopped",
			tags:[
				"monitoring",
				"uptime"
			],
			"highlights": [
				"Uptime monitoring",
				"Status pages",
				"Notifications",
			],
			"readme": "https://github.com/louislam/uptime-kuma/raw/refs/heads/master/README.md",
			"versions":[{
				"tag": "2",
				"label": "v2",
			}, {
				"tag": "2-slim",
				"label": "v2 Slim",
			}],
			"links":[
				"docs": https://github.com/louislam/uptime-kuma/wiki,
				"github": https://github.com/louislam/uptime-kuma,
				"website": https://uptime.kuma.pet/,
			],
			deployments:[
				"2": {
					"container_name": "uptime-kuma",
					"environment": [{
						"name": "TZ",
						"value": "UTC",
						"label": "Timezone",
						"editable": true,
						"required": false,
					}],
					"image": louislam/uptime-kuma:2,
					"ports":[{
						"host": 3001,
						"container": 3001,
						"label": "Web UI",
						"editable": true,
						"required": true,
					}],
					"volumes": [{
						"host": "./data",
						"container": "/app/data",
						"label": "General App Data",
						"editable": true,
						"required": true,
					}],
				},
				"2-slim": {
					"container_name": "uptime-kuma",
					"image": "louislam/uptime-kuma:2-slim",
					"ports":[{
						"host": 3001,
						"container": 3001,
						"label": "Web UI",
					}],
					"volumes": [{
						"host": "./data",
						"container": "/app/data",
						"label": "General App Data",
					}]
				}
			],
		}
	]
}